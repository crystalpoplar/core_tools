[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "core-tools-utils"
version = "0.1.0"
description = "Core utility helpers for logging, file management, and object formatting."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Core Tools Contributors"},
]
keywords = ["utilities", "logging", "json", "helpers"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]
dependencies = [
    "concurrent-log-handler>=0.9.24",
]

[project.urls]
Homepage = "https://github.com/crystalpoplar/core_tools"
Repository = "https://github.com/crystalpoplar/core_tools"
Issues = "https://github.com/crystalpoplar/core_tools/issues"
Changelog = "https://github.com/crystalpoplar/core_tools/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = [
    "pytest>=8",
]
dev = [
    "build>=1.2.2",
    "twine>=5.1.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

